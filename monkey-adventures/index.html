<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Monkey adventures</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* Nothing here is text to be selected, and a game you hold a finger
         on is all long presses. Without these, holding the jump button
         blue-selects the whole page on an iPad and pops up the copy
         callout over the top of the jungle. */
      html {
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body,
      #app,
      canvas {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      /* The picture in the middle of the glass. It fills the window in one
         direction and is centred in the other, so whatever black there is
         sits evenly either side of the game rather than all below it with
         the controls stranded in it. */
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script
      defer
      src="https://chofterstats.com/cs.js"
      data-website-id="cd2d0762-aafe-4430-988b-eb208a43fdc2"
      data-domains="games.chofter.com"></script>
  </body>
</html>
