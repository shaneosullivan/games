<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Monkey adventures</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* The picture in the middle of the glass. It fills the window in one
         direction and is centred in the other, so whatever black there is
         sits evenly either side of the game rather than all below it with
         the controls stranded in it. */
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script
      async
      src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  </body>
</html>
