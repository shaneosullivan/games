<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is what asks iOS for the whole screen in an installed
      app, safe areas included. Deliberately nothing else: iOS has ignored
      user-scalable and the scale locks since iOS 10, so adding them here would
      only look like a fix. src/core/lockZoom.ts is what actually stops zooming.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Whale</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script
      defer
      src="https://chofterstats.com/cs.js"
      data-website-id="cd2d0762-aafe-4430-988b-eb208a43fdc2"
      data-domains="games.chofter.com"></script>
  </body>
</html>
